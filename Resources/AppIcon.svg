<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6c5cd0"/>
      <stop offset="100%" stop-color="#534ab7"/>
    </linearGradient>
    <linearGradient id="pageL" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f3ee"/>
    </linearGradient>
    <linearGradient id="pageR" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8f7f2"/>
      <stop offset="100%" stop-color="#e9e6dc"/>
    </linearGradient>
    <linearGradient id="spine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d85a30"/>
      <stop offset="50%" stop-color="#e8683a"/>
      <stop offset="100%" stop-color="#d85a30"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="8" result="offsetblur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="80" y="80" width="864" height="864" rx="180" ry="180" fill="url(#bg)"/>

  <!-- Open book, viewed slightly from above -->
  <g filter="url(#shadow)">
    <!-- Left page -->
    <path d="M 180 300
             Q 180 290, 190 288
             L 500 270
             Q 510 270, 512 280
             L 512 740
             Q 512 752, 500 750
             L 190 732
             Q 180 732, 180 720 Z"
          fill="url(#pageL)"/>
    <!-- Right page -->
    <path d="M 844 300
             Q 844 290, 834 288
             L 524 270
             Q 514 270, 512 280
             L 512 740
             Q 512 752, 524 750
             L 834 732
             Q 844 732, 844 720 Z"
          fill="url(#pageR)"/>
    <!-- Center spine -->
    <rect x="502" y="275" width="20" height="470" rx="2" fill="url(#spine)"/>

    <!-- Text lines on left page -->
    <rect x="220" y="340" width="240" height="14" rx="4" fill="#3c3489" opacity="0.85"/>
    <rect x="220" y="380" width="200" height="8" rx="3" fill="#2c2c2a" opacity="0.4"/>
    <rect x="220" y="400" width="220" height="8" rx="3" fill="#2c2c2a" opacity="0.4"/>
    <rect x="220" y="420" width="180" height="8" rx="3" fill="#2c2c2a" opacity="0.4"/>
    <rect x="220" y="460" width="150" height="8" rx="3" fill="#2c2c2a" opacity="0.4"/>
    <rect x="220" y="480" width="200" height="8" rx="3" fill="#2c2c2a" opacity="0.4"/>

    <!-- Date/calendar block on right page -->
    <rect x="560" y="340" width="240" height="60" rx="6" fill="#d85a30"/>
    <text x="680" y="384" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif"
          font-size="34" font-weight="700" fill="#ffffff">MON</text>
    <rect x="560" y="410" width="240" height="140" rx="6" fill="#ffffff" stroke="#e5e3dc" stroke-width="2"/>
    <text x="680" y="518" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, system-ui, sans-serif"
          font-size="110" font-weight="300" fill="#2c2c2a">9</text>

    <!-- Lesson lines below -->
    <rect x="560" y="580" width="220" height="10" rx="4" fill="#6c5cd0" opacity="0.75"/>
    <rect x="560" y="605" width="180" height="6" rx="3" fill="#2c2c2a" opacity="0.4"/>
    <rect x="560" y="625" width="200" height="6" rx="3" fill="#2c2c2a" opacity="0.4"/>
  </g>
</svg>
